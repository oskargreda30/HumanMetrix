config:
  target: "http://localhost:5000"
  phases:
    - duration: 60
      arrivalRate: 10
      rampTo: 100
      name: "Gradual ramp to 100 users/sec"
    - duration: 120
      arrivalRate: 100
      name: "Sustained 100 users/sec"
    - duration: 60
      arrivalRate: 100
      rampTo: 200
      name: "Push to 200 users/sec"
    - duration: 60
      arrivalRate: 200
      name: "Peak stress test"
  defaults:
    headers:
      Content-Type: "application/json"

scenarios:
  - name: "Mixed Load"
    flow:
      - get:
          url: "/"
      - think: 0.5
      - get:
          url: "/api/user"
      - think: 0.5
      - get:
          url: "/api/fit-questions"
